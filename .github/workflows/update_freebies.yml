name: Update Freebies

on:
  schedule:
    - cron: "37 * * * *" # backup only, off-peak minute
  workflow_dispatch: # allow manual trigger from Actions UI

permissions:
  contents: write

concurrency:
  group: update-freebies
  cancel-in-progress: false # avoids overlapping runs/push conflicts

jobs:
  update:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Firestore credentials (unchanged — still needed for Firestore)
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}

          # FCM HTTP v1 uses the same service-account JSON as Firestore.
          # This override is optional; otherwise FCM uses project_id from it.
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}

          # Game enrichment APIs (unchanged)
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_ACCESS_TOKEN: ${{ secrets.IGDB_ACCESS_TOKEN }}
        run: python update_freebies.py

      - name: Commit skipped_games.json if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add skipped_games.json freebies.json || true
          git commit -m "chore: update freebies + skipped log [skip ci]" || echo "Nothing to commit"
          git push
